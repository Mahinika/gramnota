name: Firestore rules

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: test/firestore_rules/package-lock.json

      - name: Test firestore.rules
        working-directory: test/firestore_rules
        env:
          CI: true
        run: |
          npm ci
          npm test
