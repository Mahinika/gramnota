name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    # A healthy release is about 15 minutes. 45 matches the Windows job and
    # stops a hung runner from occupying the slot for the default 6 hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          cache: true

      - name: Decode the upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, and ANDROID_KEY_PASSWORD."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=upload\nstoreFile=upload-keystore.jks\n' \
            "$ANDROID_KEYSTORE_PASSWORD" \
            "$ANDROID_KEY_PASSWORD" > android/key.properties

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Add the GOOGLE_SERVICES_JSON repository secret before this build can sign in to Firebase."
            exit 1
          fi
          printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - run: flutter pub get
      - name: Build release APK
        run: |
          name="$(python3 -c 'import re; text=open("pubspec.yaml", encoding="utf-8").read(); match=re.search(r"^version:\s*(\d+\.\d+\.\d+)\+\d+\s*$", text, re.M); print(match.group(1))')"
          flutter build apk --release --build-name="$name" --build-number="${{ github.run_number }}"

      - uses: actions/upload-artifact@v4
        with:
          name: gramnota-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish APK on the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BUILD: ${{ github.run_number }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/Gramnota.apk"
          bash .github/scripts/publish_release.sh android "$RUNNER_TEMP/Gramnota.apk"
