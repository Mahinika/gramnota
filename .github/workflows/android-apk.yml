name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Add the GOOGLE_SERVICES_JSON repository secret before this build can sign in to Firebase."
            exit 1
          fi
          printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: gramnota-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish APK on the android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android --yes --cleanup-tag || true
          gh release create android \
            "build/app/outputs/flutter-apk/app-release.apk#gramnota.apk" \
            --title "Gramnota APK" \
            --notes "Release APK built from ${GITHUB_SHA}." \
            --target "$GITHUB_SHA"
