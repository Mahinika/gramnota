name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    # A healthy release is about 15 minutes. Cap the job so a runner that
    # hangs after the APK is published cannot occupy the slot for hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true

      - name: Decode the upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, and ANDROID_KEY_PASSWORD."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=upload\nstoreFile=upload-keystore.jks\n' \
            "$ANDROID_KEYSTORE_PASSWORD" \
            "$ANDROID_KEY_PASSWORD" > android/key.properties

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Add the GOOGLE_SERVICES_JSON repository secret before this build can sign in to Firebase."
            exit 1
          fi
          printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      # One-shot CI builds do not reuse a Gradle daemon. Leftover JVMs make
      # the runner hang in "Terminate orphan process" after the APK is published.
      - name: Keep Gradle from leaving daemons behind
        run: |
          grep -q '^org.gradle.daemon=' android/gradle.properties || echo 'org.gradle.daemon=false' >> android/gradle.properties
          grep -q '^org.gradle.vfs.watch=' android/gradle.properties || echo 'org.gradle.vfs.watch=false' >> android/gradle.properties

      - run: flutter pub get
      - run: flutter build apk --release

      - name: Stop leftover Gradle processes
        if: always()
        run: |
          pkill -9 -f GradleDaemon || true
          pkill -9 -f KotlinCompileDaemon || true
          if [ -x android/gradlew ]; then
            (cd android && timeout 30 ./gradlew --stop) || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: gramnota-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish APK on the android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android --yes --cleanup-tag || true
          gh release create android \
            "build/app/outputs/flutter-apk/app-release.apk#gramnota.apk" \
            --title "Gramnota APK" \
            --notes "Release APK built from ${GITHUB_SHA}." \
            --target "$GITHUB_SHA"
